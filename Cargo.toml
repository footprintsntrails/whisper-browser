[workspace]
resolver = "3"
# gecko/overlay/toolkit/components/clipguard/rust is the ClickFix check that is built
# into the browser; it is a member here so `cargo test` and `cargo clippy` cover it.
# Its C ABI (../ffi) needs Firefox's tree and is built only there.
members = ["crates/xtask", "gecko/overlay/toolkit/components/clipguard/rust"]
exclude = ["gecko/overlay/toolkit/components/clipguard/ffi"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
repository = "https://github.com/footprintsntrails/whisper-browser"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
