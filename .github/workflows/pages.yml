name: pages

# Deploys Whisper's update host (GitHub Pages). A Pages deploy replaces the whole site,
# so the site is always built here, in one job, from both channels as they are
# published on GitHub: the update.xml files of the newest release (assets of the newest
# non-pre-release that has them) and those of Whisper Canary (assets of the rolling
# canary pre-release). A canary publish never drops the release files, and a release
# never drops the canary's (gecko/scripts/update/site.py).
#
# Called by release.yml after a release, and by gecko.yml and gecko-ui-quick.yml after
# a canary publish; also by hand, and by a push that changes how the site is built
# (which also redeploys the site after release files were changed by hand).

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, wip/gecko, wip/updates]
    paths:
      - .github/workflows/pages.yml
      - gecko/scripts/update/site.py

permissions:
  contents: read

jobs:
  site:
    name: Update host files (both channels)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The update files of the newest release and of Whisper Canary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # shellcheck source=gecko/release.env
          . gecko/release.env
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/canary"
          release=''
          for tag in $(gh release list --exclude-drafts --exclude-pre-releases --limit 50 --json tagName -q '.[].tagName'); do
            if gh release view "$tag" --json assets -q '.assets[].name' | grep -qx 'update-linux-x86_64.xml'; then
              gh release download "$tag" --pattern 'update-*.xml' --dir "$RUNNER_TEMP/release"
              release=$tag
              break
            fi
          done
          canary=''
          if gh release view "$CANARY_TAG" --json assets -q '.assets[].name' 2> /dev/null | grep -q '^update-canary-'; then
            gh release download "$CANARY_TAG" --pattern 'update-canary-*.xml' --dir "$RUNNER_TEMP/canary"
            canary=$CANARY_TAG
          fi
          echo "release: ${release:-none yet}; canary: ${canary:-none yet}"
          python3 gecko/scripts/update/site.py --site "$RUNNER_TEMP/site" \
            --release "$RUNNER_TEMP/release" --canary "$RUNNER_TEMP/canary"
          find "$RUNNER_TEMP/site" -type f | sort
          {
            echo "## Update host"
            echo "Release: ${release:-none yet}. Canary: ${canary:-none yet}."
            echo '```'
            (cd "$RUNNER_TEMP/site" && find . -type f | sort)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
      # The same files again, to compare with what the host serves after the deploy.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-host-site
          path: ${{ runner.temp }}/site/
          retention-days: 7

  deploy:
    name: Deploy (GitHub Pages)
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # One deploy at a time; each one carries both channels, so the last one is right.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-host-site
          path: ${{ runner.temp }}/site
      - name: Installed copies can see the updates
        run: |
          # shellcheck source=gecko/release.env
          . gecko/release.env
          for file in $(cd "$RUNNER_TEMP/site" && find update -name update.xml | sort); do
            url="$UPDATE_BASE_URL/$file"
            ok=''
            for _ in $(seq 1 30); do
              if curl -fsS "$url" -o served.xml && cmp -s served.xml "$RUNNER_TEMP/site/$file"; then ok=1; break; fi
              sleep 10
            done
            [ -n "$ok" ] || { echo "::error::$url does not serve the deployed file"; exit 1; }
            mar=$(sed -n 's/.* URL="\([^"]*\)".*/\1/p' served.xml)
            curl -fsSL -o /dev/null -w "$file: OK; MAR %{http_code} after %{num_redirects} redirect(s), %{size_download} bytes\n" "$mar"
          done
