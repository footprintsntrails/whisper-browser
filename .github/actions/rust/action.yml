name: Rust toolchain
description: Installs the toolchain pinned in rust-toolchain.toml (plus extra targets) and restores the cargo cache.

inputs:
  targets:
    description: Extra compilation targets, separated by spaces
    required: false
    default: ""
  cache-key:
    description: Extra key for the cargo cache
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install the pinned toolchain
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
        rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --no-self-update
        for target in $TARGETS; do rustup target add --toolchain "$channel" "$target"; done
        rustc --version
        cargo --version

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.cache-key }}
