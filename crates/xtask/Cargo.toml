[package]
name = "xtask"
description = "Build tooling for Whisper: bundles, icons, artwork, packages, release manifest and checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
flate2 = "1"
icns = { version = "0.5", default-features = false, features = ["pngio"] }
ico = "0.6"
regex = "1"
resvg = { version = "0.49", default-features = false, features = ["text"] }
serde_json = "1"
tar = { version = "0.4", default-features = false }
whisper = { path = "../whisper" }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
