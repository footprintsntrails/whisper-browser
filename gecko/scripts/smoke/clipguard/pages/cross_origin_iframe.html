<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Cross-origin iframe writes on postMessage</title>
<script src="common.js"></script></head>
<body><h1>Cross-origin iframe writes on postMessage</h1>
<p>The frame below is served from the other test origin.</p>
<iframe id="f" src="http://IFRAME_HOST/iframe_child.html" style="width:300px;height:80px"></iframe>
<button id="go">Trigger</button>
<script>document.getElementById("go").addEventListener("click",()=>document.getElementById("f").contentWindow.postMessage("copy","*"));</script>
</body></html>
