# cargo-deny: advisories, licenses and sources of the Rust crates this repository builds
# with (the build tooling in crates/xtask; the browser's own Rust code comes with Firefox).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
# Dev-dependencies only run in tests and are never shipped.
exclude-dev = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
